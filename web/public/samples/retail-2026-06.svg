<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">2026 年 6 月社会消费品零售总额环比增长 0.35%</title>
  <desc id="desc">团队自制示意图：社会消费品零售总额 2026 年 1—6 月月度环比增速，6 月为上涨 0.35%。图上没有写数据来源以外的说明。</desc>
  <rect width="960" height="640" fill="#edf2f0"/>
  <rect width="960" height="12" fill="#143c46"/>
  <text x="54" y="56" fill="#176b68" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="700">图表摘录　/　团队自制</text>
  <text x="54" y="118" fill="#35595f" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20">社会消费品零售总额 · 月度环比增速</text>
  <text x="54" y="164" fill="#143c46" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="32" font-weight="700">2026 年 6 月环比增长 0.35%</text>
  <text x="54" y="196" fill="#6b7f84" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">全国 · 单位：%　（正值上涨，负值下降）</text>

  <line x1="120" y1="430" x2="900" y2="430" stroke="#8fa5a3" stroke-width="1.5"/>
  <text x="96" y="435" text-anchor="end" fill="#6b7f84" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">0</text>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" text-anchor="middle">
    <rect x="150" y="383.2" width="70" height="46.8" fill="#7fb3ad"/>
    <text x="185" y="375" fill="#35595f">0.18</text>
    <text x="185" y="456" fill="#35595f">1 月</text>

    <rect x="270" y="370.2" width="70" height="59.8" fill="#7fb3ad"/>
    <text x="305" y="362" fill="#35595f">0.23</text>
    <text x="305" y="456" fill="#35595f">2 月</text>

    <rect x="390" y="404" width="70" height="26" fill="#7fb3ad"/>
    <text x="425" y="396" fill="#35595f">0.10</text>
    <text x="425" y="456" fill="#35595f">3 月</text>

    <rect x="510" y="430" width="70" height="70.2" fill="#c98b8b"/>
    <text x="545" y="522" fill="#8c2f24">-0.27</text>
    <text x="545" y="456" fill="#35595f">4 月</text>

    <rect x="630" y="430" width="70" height="39" fill="#c98b8b"/>
    <text x="665" y="491" fill="#8c2f24">-0.15</text>
    <text x="665" y="456" fill="#35595f">5 月</text>

    <rect x="750" y="339" width="70" height="91" fill="#176b68"/>
    <text x="785" y="331" fill="#143c46" font-weight="700">0.35</text>
    <text x="785" y="456" fill="#143c46" font-weight="700">6 月</text>
  </g>

  <text x="54" y="566" fill="#6b7f84" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">团队自制示意图，不是国家统计局原图；月度环比数值取自国家统计局 2026-08-17 发布的附注 5。</text>
  <text x="54" y="594" fill="#6b7f84" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">本图只用于演示，不代表现实零售数据。</text>
</svg>
