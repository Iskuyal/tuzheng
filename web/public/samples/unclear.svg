<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">含有模糊数字标签的年营业收入图表</title>
  <desc id="desc">团队自制示例，2025 年数字标签被模糊处理，不能据此推测具体数值。</desc>
  <defs><filter id="blur"><feGaussianBlur stdDeviation="4.5"/></filter></defs>
  <rect width="960" height="640" fill="#edf2f0"/>
  <rect width="960" height="12" fill="#143c46"/>
  <text x="54" y="56" fill="#176b68" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="700">图表摘录　/　团队自制</text>
  <text x="54" y="112" fill="#132d3b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="36" font-weight="700">年营业收入增长 25%</text>
  <text x="54" y="148" fill="#64777a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">年度收入变化 · 2024—2025</text>
  <rect x="54" y="183" width="852" height="385" rx="8" fill="#ffffff" stroke="#d7e0dc"/>
  <text x="88" y="222" fill="#41585d" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">营业收入</text>
  <text x="849" y="222" fill="#64777a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" text-anchor="end">单位：万元</text>
  <g stroke="#e4eae7" stroke-width="1">
    <line x1="162" y1="270" x2="840" y2="270"/><line x1="162" y1="326" x2="840" y2="326"/>
    <line x1="162" y1="382" x2="840" y2="382"/><line x1="162" y1="438" x2="840" y2="438"/>
    <line x1="162" y1="494" x2="840" y2="494"/>
  </g>
  <g fill="#536a73" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" text-anchor="end">
    <text x="145" y="274">160</text><text x="145" y="330">120</text><text x="145" y="386">80</text>
    <text x="145" y="442">40</text><text x="145" y="498">0</text>
  </g>
  <line x1="162" y1="494" x2="840" y2="494" stroke="#aebdb8" stroke-width="1.5"/>
  <rect x="296" y="382" width="128" height="112" fill="#82aaa4"/>
  <rect x="582" y="354" width="128" height="140" fill="#1c7471"/>
  <text x="360" y="366" fill="#17333e" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" text-anchor="middle">80</text>
  <text x="646" y="338" fill="#17333e" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" text-anchor="middle" filter="url(#blur)">100</text>
  <path d="M601 321 Q646 310 690 324 L691 350 Q646 342 601 354 Z" fill="#c3cfca" opacity=".62"/>
  <g fill="#52696d" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" text-anchor="middle">
    <text x="360" y="526">2024 年</text><text x="646" y="526">2025 年</text>
  </g>
  <text x="54" y="606" fill="#52646b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">关键标签已模糊　/　请勿按柱高猜数</text>
</svg>
