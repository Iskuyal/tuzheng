<text x="24" y="191" font-family="&quot;Noto Sans SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="400" fill="#5B6B62" text-anchor="start" dominant-baseline="hanging"><tspan x="24" dy="0">当前查看：数值与图下注释</tspan></text>
<rect x="22" y="229" width="346" height="610" rx="3" fill="#E7EDE3" stroke="#7C8F80" stroke-width="1" />
<defs><clipPath id="original-viewport"><rect x="23" y="230" width="344" height="608" rx="3"/></clipPath></defs>
<g clip-path="url(#original-viewport)">
<svg x="-40" y="200" width="960" height="640.0" viewBox="0 0 960 640">
  
  
  <rect width="960" height="640" fill="#edf2f0"/>
