</style></head><body><main><h1>图证 · 90秒真实项目实录</h1><p>实际 Vue 页面与 Express API，模型响应来自当次真实请求。团队自制输入图；读取失败、待核对项和真实工具轨迹均保留。</p><video controls playsinline preload="metadata"></video><p id="status" role="status">正在读取实录信息。</p><nav><a id="download" hidden download>下载90秒MP4</a><a id="uncut" hidden download>下载完整原始录屏</a><a href="README.md">源码与复现说明</a></nav></main><script type="module">
